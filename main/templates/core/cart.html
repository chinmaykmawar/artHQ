<section id="cart">
  <div id="cart_overlay"></div>
  <div id="cart_drawer">
    <div id="cart_header">
      <span id="cart_back">←</span>
      <span>Cart (<span id="cart_count">0</span>)</span>
    </div>
    <div id="cart_body">
      <div id="cart_items"></div>
      <div id="cart_coupon">
        <input type="text" placeholder="Enter coupon code" />
        <button>Apply</button>
      </div>
    </div>
    <div id="cart_footer">
      <div id="cart_total">
        <span>Estimated Total</span>
        <span id="cart_total_price">₹0</span>
      </div>
      <button id="checkout_btn">BUY NOW</button>
    </div>
  </div>
</section>
